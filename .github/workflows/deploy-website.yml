name: Deploy Website to Zephyr

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'web-infra-dev/rsbuild' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: true

      - name: Verify Zephyr token
        env:
          ZE_CI_TOKEN: ${{ secrets.ZE_CI_TOKEN }}
        run: test -n "$ZE_CI_TOKEN" || { echo '::error::Set repository secret ZE_CI_TOKEN.'; exit 1; }

      - name: Build workspace packages
        run: pnpm build

      - name: Build and deploy website
        env:
          ZE_CI_TOKEN: ${{ secrets.ZE_CI_TOKEN }}
          ZE_FAIL_BUILD: true
        run: pnpm --filter rsbuild-website build
