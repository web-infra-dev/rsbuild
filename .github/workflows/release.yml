name: Release

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        type: choice
        description: 'Specify npm tag'
        required: true
        default: 'alpha'
        options:
          - alpha
          - beta
          - rc
          - canary
          - latest
          - latest-v1
      npm_tag_confirm:
        type: choice
        description: 'Confirm npm tag'
        required: true
        options:
          - alpha
          - beta
          - rc
          - canary
          - latest
          - latest-v1
      branch:
        description: 'Release Branch (confirm release branch)'
        required: true
        default: 'main'

permissions: {}

jobs:
  validate_inputs:
    name: Validate Inputs
    if: github.repository == 'web-infra-dev/rsbuild' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate npm tag confirmation
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
          NPM_TAG_CONFIRM: ${{ inputs.npm_tag_confirm }}
        run: |
          if [ "$NPM_TAG" != "$NPM_TAG_CONFIRM" ]; then
            echo "Error: npm_tag and npm_tag_confirm must match"
            echo "npm_tag: $NPM_TAG"
            echo "npm_tag_confirm: $NPM_TAG_CONFIRM"
            exit 1
          fi
          echo "npm_tag validation passed: $NPM_TAG"

  release:
    name: Release
    if: github.repository == 'web-infra-dev/rsbuild' && github.event_name == 'workflow_dispatch'
    needs: validate_inputs
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # Provenance generation in GitHub Actions requires "write" access to the "id-token"
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.event.inputs.branch }}

      - name: Record release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Setup Pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: true

      - name: Build
        run: node --run build

      - name: Publish to npm
        run: |
          pnpm --filter './packages/*' -r stage publish --tag ${{ github.event.inputs.npm_tag }} --no-git-checks

  deploy-website:
    name: Deploy website to production
    if: inputs.npm_tag == 'latest' && inputs.branch == 'main'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: true

      - name: Build workspace packages
        run: pnpm build

      - name: Build and deploy website to production
        env:
          ZE_CI_TOKEN: ${{ secrets.ZE_CI_TOKEN }}
          ZE_FAIL_BUILD: true
          ZE_ENV: production
        run: pnpm --filter rsbuild-website build
