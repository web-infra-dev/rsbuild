catalogs:
  loader-utils-2:
    'loader-utils': '^2.0.4'

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  svelte-preprocess: false

dedupePeers: true

enableGlobalVirtualStore: true

autoInstallPeers: false

peerDependencyRules:
  ignoreMissing:
    - webpack
    - '@algolia/client-search'
    - algoliasearch
    - search-insights

engineStrict: true

hoistPattern: []

# Reduce the risk of installing compromised packages
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - 'path-serializer@0.7.0'
  - '@rspack/*'
  - 'rspack-chain'
  - '@rsbuild/*'
  - '@rslib/*'
  - '@rspress/*'
  - '@rstest/*'
  - '@rslint/*'
  - 'rstack'
  - 'connect-next'
  - '@tailwindcss/*'
  - 'rslog'
  - 'tailwindcss'
  - 'reduce-configs'
  - '@rstackjs/*'
  - 'rsbuild-plugin-*'
  - '@swc/*'
  - 'heading-case'

patchedDependencies:
  css-loader@7.1.5: patches/css-loader@7.1.5.patch
  dotenv-expand@13.0.0: patches/dotenv-expand@13.0.0.patch
  postcss-loader@8.2.1: patches/postcss-loader@8.2.1.patch

# Prevent un-reviewed build scripts
strictDepBuilds: true

strictPeerDependencies: false
